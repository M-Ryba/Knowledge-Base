<h1>Resources</h1>

@if (resources$ | async; as resources) {
  <mat-list class="resource-list">
    @for (resource of resources; track resource.id) {
      <mat-list-item class="resource-item">
        <h3 matListItemTitle>{{ resource.title }}</h3>
        <p matListItemLine>{{ resource.description }}</p>
      </mat-list-item>
      @if (!$last) {
        <mat-divider />
      }
    }
  </mat-list>
} @else {
  <p class="loading">Loading...</p>
}
